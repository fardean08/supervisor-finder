name: Flutter Tests
on: [push, pull_request]
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Generate JUnit report
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          dart pub global activate junitreport
          flutter test --reporter json > test-events.json
          dart pub global run junitreport:tojunit --input test-events.json --output test-report.xml
          echo "Generated test-report.xml with $(grep -c '<testcase' test-report.xml) testcases:"
          cat test-report.xml
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v1
        with:
          name: Flutter Test Results
          path: test-report.xml
          reporter: java-junit
